version: '3.8'

services:
  wazuh.manager:
    image: wazuh/wazuh-manager:${WAZUH_VERSION}
    container_name: wazuh-manager
    restart: unless-stopped
    ports:
      - "1514:1514/udp"     # syslog de agentes
      - "1515:1515"         # enrollment de agentes
      - "514:514/udp"
      - "55000:55000"       # Wazuh API
    volumes:
      - wazuh-manager-data:/var/ossec/data
    networks:
      soc_net:
        ipv4_address: 192.168.20.10

  wazuh.indexer:
    image: wazuh/wazuh-indexer:${WAZUH_VERSION}
    container_name: wazuh-indexer
    environment:
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${INDEXER_PASSWORD}
    ports:
      - "9200:9200"
    networks:
      soc_net:
        ipv4_address: 192.168.20.11

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:${WAZUH_VERSION}
    container_name: wazuh-dashboard
    environment:
      - WAZUH_DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD}
    ports:
      - "443:5601"
    depends_on:
      - wazuh.indexer
      - wazuh.manager
    networks:
      soc_net:
        ipv4_address: 192.168.20.12

networks:
  soc_net:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.20.0/24

volumes:
  wazuh-manager-data:
